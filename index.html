<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הבזקים חכמים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Rubik:wght@500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>

/* Layout: form steps in a column beside a live phone-sized preview; stacks on narrow screens */
:root{
  --bg:#eef0f5; --panel:#ffffff; --ink:#1a2238; --muted:#5b6380; --line:#d9dce8;
  --brand:#1f3a8a; --brand-ink:#ffffff; --gold:#c9962e; --ok:#2f7d55; --bad:#b4372f; --field:#f7f8fb;
  --brandfont:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --display:"Rubik","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --body:"IBM Plex Sans Hebrew","IBM Plex Sans Arabic",system-ui,sans-serif;
  --night:#071230; --night-ink:#f3e7c4; --spark:#e2b44f;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131c; --panel:#191e2c; --ink:#e7eaf3; --muted:#9aa2bd; --line:#2b3249;
  --brand:#3b5bc4; --brand-ink:#ffffff; --gold:#e0b04f; --ok:#5fc08b; --bad:#ef7d74; --field:#141826; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131c; --panel:#191e2c; --ink:#e7eaf3; --muted:#9aa2bd; --line:#2b3249;
  --brand:#3b5bc4; --brand-ink:#ffffff; --gold:#e0b04f; --ok:#5fc08b; --bad:#ef7d74; --field:#141826; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding:0 16px}
.page{max-width:1180px;margin:0 auto;padding-block:28px 56px;display:flex;flex-direction:column;gap:22px}
.top{position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at 70% 40%,#16255a 0%,var(--night) 55%,#020713 100%);color:var(--night-ink);display:flex;align-items:center;gap:22px;padding:18px 26px;border-bottom:3px solid var(--spark)}
.top .mark{width:150px;flex:none;-webkit-mask-image:radial-gradient(closest-side,#000 78%,transparent 100%);mask-image:radial-gradient(closest-side,#000 78%,transparent 100%)}
.top .mark img{display:block;width:100%;height:auto}
.top .words{display:flex;flex-direction:column;gap:4px;min-width:0}
.top h1{font-family:var(--brandfont);font-weight:700;font-size:2.4rem;margin:0;line-height:1.2;color:var(--spark);letter-spacing:.01em}
.top .tag{margin:0;font-family:var(--brandfont);font-size:1.15rem;font-weight:500;color:var(--night-ink)}
.top .by{margin:0;font-size:.9rem;color:#c7b98f;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
.top .by b{color:var(--night-ink);font-weight:600}
@media (max-width:560px){.top{flex-direction:column;text-align:center;padding:18px}.top .mark{width:130px}.top h1{font-size:2rem}}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.steps{display:flex;flex-direction:column;gap:16px;min-width:0}
.step{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.step h2{font-family:var(--display);font-size:1.15rem;margin:0;display:flex;align-items:center;gap:10px}
.num{width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;justify-content:center;font-family:var(--body);font-size:.9rem;font-weight:600;flex:none}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.row{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.label{font-weight:600;font-size:.9rem}
.hint{color:var(--muted);font-size:.82rem}
input[type=text],input[type=url],select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:92px;resize:vertical;direction:ltr;text-align:left;font-size:.85rem}
input.ltr{direction:ltr;text-align:left}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,.seg label:focus-within{outline:3px solid var(--gold);outline-offset:1px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg label{border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;background:var(--field)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.seg b{font-size:.92rem}
.seg span{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.seg{grid-template-columns:minmax(0,1fr)}}
.logo-pick{display:flex;align-items:center;gap:12px}
.logo-box{width:64px;height:64px;border-radius:10px;border:1px dashed var(--line);background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;color:#8a90a6;font-size:.7rem;text-align:center}
.logo-box img{max-width:100%;max-height:100%}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:.88rem;margin:0}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.chip.zero{color:var(--muted)}
.result{display:flex;flex-direction:column;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px}
.link{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;word-break:break-all;user-select:all}
ol.how{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:8px;min-width:0}
.preview .label{color:var(--muted)}
.frame{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);height:720px;max-height:80vh}
.frame iframe{width:100%;height:100%;border:0;display:block}
.frame .empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:24px;text-align:center}
@media (max-width:900px){.preview{position:static}.frame{height:620px}}

.top .words{flex:1}
.top h1{font-family:"Rubik","IBM Plex Sans Hebrew",system-ui,sans-serif}
.top .by{font-family:"IBM Plex Sans Hebrew","IBM Plex Sans Arabic",system-ui,sans-serif}
.langs{position:absolute;top:12px;inset-inline-end:14px;display:flex;gap:4px;background:rgba(255,255,255,.08);border:1px solid rgba(226,180,79,.35);border-radius:999px;padding:3px}
.langs button{font:inherit;font-size:.82rem;font-weight:600;color:var(--night-ink);background:transparent;border:0;border-radius:999px;padding:4px 12px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--spark);color:#1b1404}
.langs button:focus-visible{outline:2px solid var(--spark);outline-offset:2px}
@media (max-width:560px){.langs{position:static;align-self:center;order:-1}}
html[lang="ar"] body{font-family:"IBM Plex Sans Arabic","IBM Plex Sans Hebrew",system-ui,sans-serif}
html[lang="ar"] .step h2{font-family:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif}
html[lang="en"] body,html[lang="en"] .step h2{font-family:"Rubik",system-ui,sans-serif}
html[dir="ltr"] textarea,html[dir="ltr"] .ltr{text-align:left}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

      YEAR: y+"-"+(y+1)+(cl==="he"?" · "+hebYear(y+3761):""),
      SCHOOL: escHtml(school),
      CONFIG: safeJSON({lang:cl, school:school, startYear:y, store:"staff-done-"+s, sources: mode()==="google"?sources:[], data: months})
    });
    updateOut();
  }

  function updateOut(){
    var s=slug();
    $("download").disabled=!built||!s;
    $("fname").textContent= s ? L().fname(s) : L().fnameMissing;
    var f=$("frame");
    if(built){
      var ifr=f.querySelector("iframe");
      if(!ifr || ifr.getAttribute("data-src")!==String(built.length)+built.slice(-200)){
        f.innerHTML=""; ifr=document.createElement("iframe"); ifr.srcdoc=built; ifr.setAttribute("data-src",String(built.length)+built.slice(-200)); f.appendChild(ifr);
      }
      ifr.title=L().preview;
    } else f.innerHTML='<div class="empty">'+escHtml(L().previewEmpty)+'</div>';
    var site=$("site").value.trim();
    if(site && s){
      if(!/\/$/.test(site)) site+="/";
      $("finalLink").textContent=site+s+".html"; $("result").hidden=false;
    } else $("result").hidden=true;
  }

  ["school","year","calLang"].forEach(function(id){ $(id).addEventListener("change",function(){ if(id==="year"&&months.length) read(); else build(); }); });
  $("slug").addEventListener("input",function(){ build(); updateOut(); });
  $("site").addEventListener("input",function(){ try{ localStorage.setItem("cal-site",this.value.trim()); }catch(e){} updateOut(); });
  try{ var sv=localStorage.getItem("cal-site"); if(sv) $("site").value=sv; }catch(e){}

  $("download").addEventListener("click",function(){
    var blob=new Blob([built],{type:"text/html;charset=utf-8"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=slug()+".html";
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
  });
  $("copy").addEventListener("click",function(){
    var t=$("finalLink").textContent;
    var p=navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject();
    p.then(function(){ $("copied").textContent=L().copied; }).catch(function(){
      var r=document.createRange(); r.selectNodeContents($("finalLink")); var sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
      $("copied").textContent=L().copyManual;
    });
  });

  var saved="he"; try{ saved=localStorage.getItem("sparks-lang")||"he"; }catch(e){}
  syncMode(); applyLang(saved); read();
})();
</script>
</body>
</html>
